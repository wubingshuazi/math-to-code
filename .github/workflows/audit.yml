name: Numerical reproducibility
on: [push, pull_request]
permissions:
  contents: read
jobs:
  audit:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: math-to-code gad --gamma 0.35 --nu 0.2
      - run: python -m unittest discover -s tests -v
      - if: matrix.python == '3.14'
        run: python -m pip install -r requirements-audit.txt
      - if: matrix.python == '3.14'
        run: python scripts/validate_quantum.py
      - if: matrix.python == '3.14'
        run: python scripts/validate_thermal.py
