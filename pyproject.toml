[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-code-gad"
version = "0.2.0"
description = "GAD Holevo optimization, quantitative thermal entropy-gap bounds, and reproducible matrix experiments"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
audit = ["numpy>=2.2,<3"]

[project.scripts]
math-to-code = "math_to_code.__main__:main"

[tool.setuptools.packages.find]
include = ["math_to_code*"]
