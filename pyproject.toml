[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "math-to-code-gad"
version = "0.1.0"
description = "Reproducible GAD Holevo optimization and independent numerical audits of OpenAI math family 276"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = []

[project.optional-dependencies]
audit = ["numpy>=2.2,<3"]

[project.scripts]
math-to-code = "math_to_code.__main__:main"

[tool.setuptools.packages.find]
include = ["math_to_code*"]
